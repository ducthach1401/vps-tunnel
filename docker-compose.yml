services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    environment:
      HEADSCALE_URL: ${HEADSCALE_URL?HEADSCALE_URL is required}
      HEADSCALE_PREFIX_V4: ${HEADSCALE_PREFIX_V4?HEADSCALE_PREFIX_V4 is required}
    command:
      - /bin/sh
      - -ec
      - |
        : "$${HEADSCALE_URL:?HEADSCALE_URL is required}"
        sed -e "s|__HEADSCALE_URL__|$${HEADSCALE_URL}|g" -e "s|__HEADSCALE_PREFIX_V4__|$${HEADSCALE_PREFIX_V4}|g" /etc/headscale/config.template.yaml > /tmp/config.yaml
        exec headscale serve --config /tmp/config.yaml
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.template.yaml:ro
      - ./headscale/data:/var/lib/headscale
    expose:
      - "8080"

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DISABLE_IPV6: "true"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt

  headscale-ui:
    image: ghcr.io/gurucomputing/headscale-ui:latest
    container_name: headscale-ui
    restart: unless-stopped
    expose:
      - "8080"
